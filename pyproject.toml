[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-flow"
version = "0.3.0"
description = "面向项目解耦的 AMD FPGA 构建、验证与板级部署编排工具"
requires-python = ">=3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.optional-dependencies]
uart = ["pyserial>=3.5"]

[project.scripts]
fpga-flow = "fpga_flow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fpga_flow = ["schema/*.json", "profiles/*.toml"]
