name: FPGAFlow release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: Verify tag version
        run: test "v$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed CLI
        run: |
          python -m venv /tmp/fpga-flow-release
          /tmp/fpga-flow-release/bin/pip install dist/*.whl
          /tmp/fpga-flow-release/bin/fpga-flow --version
      - name: Publish private GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=("$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-dev* || "$GITHUB_REF_NAME" == *-alpha* || "$GITHUB_REF_NAME" == *-beta* || "$GITHUB_REF_NAME" == *-rc* ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
